name: release

# Tag-triggered. CI artifacts expire after ninety days and live on a run page
# nobody thinks to visit; a release is permanent and sits on the repository
# front page, which is where someone looking for a binary actually looks.
#
#   git tag -a v0.1.0 -m "..." && git push origin v0.1.0
#
# What this builds is not what ci.yml builds. CI links the ffmpeg the platform
# packages, because that is fast and it is what a person building from source
# will have. A release binary is downloaded by someone who has never installed
# ffmpeg and never will, so every one of these links a static ffmpeg built here
# by tools/build-ffmpeg.sh. What comes out needs nothing but the operating
# system's own libraries, and each job checks that rather than assuming it.
#
# That ffmpeg is built with libx264, which is GPL. The archives therefore ship
# under the GPL as a whole - see NOTICE, and the BINARY-LICENCE.txt each
# archive carries.
#
# The ffmpeg build takes fifteen to thirty minutes per platform and is cached
# on the hash of the script that produces it, so only the first release after a
# change to it pays for one.
#
# With one wrinkle worth knowing before you go looking for it: GitHub scopes
# caches by ref. A run triggered by pushing a tag writes its caches under
# refs/tags/whatever, where nothing else will ever look for them. Reads fall
# back to the default branch, so caches written by a run on main are visible to
# every later tag - which means the first tagged release builds ffmpeg five
# times and looks like the cache is not working. It is; it just had nothing on
# main to read yet.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write        # needed to create the release

env:
  RAYLIB_VERSION: "5.5"

jobs:
  # ------------------------------------------------------------------
  # Linux, on the oldest runner image still supported: a binary linked
  # against glibc 2.39 does not start on anything older, and "anything older"
  # includes most machines someone would want to edit video on.
  # ------------------------------------------------------------------
  linux:
    name: linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: arm64,  runner: ubuntu-22.04-arm }
    steps:
      # The tag, not the branch.
      #
      # On a tag push these are the same thing. On workflow_dispatch they are
      # not: checkout defaults to the branch the run was dispatched from, so
      # naming a tag would build main's code and attach it to that tag's
      # release - assets that do not match the commit they claim to be.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Build tools, X11 and GL
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm pkg-config git \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev xvfb ffmpeg

      - name: Cached static ffmpeg
        id: ffcache
        uses: actions/cache@v6
        with:
          path: vendor/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('tools/build-ffmpeg.sh') }}

      - name: Build static ffmpeg
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: tools/build-ffmpeg.sh --jobs 4

      - name: raylib
        run: |
          git clone --depth 1 --branch "$RAYLIB_VERSION" \
            https://github.com/raysan5/raylib.git /tmp/raylib
          tools/no-gamepads.sh /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build -DCMAKE_INSTALL_PREFIX=/tmp/rl \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/raylib/build -j3
          cmake --install /tmp/raylib/build

      - name: What the build decided
        run: RAYLIB=/tmp/rl make info

      - name: Build
        run: RAYLIB=/tmp/rl make

      - name: Tests
        run: |
          make testmedia
          make test

      # The whole point of the static build. If an libav* turns up here, the
      # archive is one that fails to start on the machine it was downloaded to
      # - and it would do it with a linker error nobody can act on.
      - name: It carries its own ffmpeg
        run: |
          ldd bencsnip
          if ldd bencsnip | grep -E 'libav|libsw|libx264|libraylib'; then
            echo "still needs a shared ffmpeg or raylib"
            exit 1
          fi
          echo "self-contained"

      - name: The window comes up
        run: |
          xvfb-run -a -s "-screen 0 1400x900x24" \
            ./bencsnip media/test1.mp4 --shot release-window.png --frames 60
          test -s release-window.png

      - name: Package
        run: tools/package.sh "linux-${{ matrix.arch }}" "${{ github.event.inputs.tag || github.ref_name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------------------------
  # macOS, Apple silicon only.
  #
  # Intel is deliberately not built. It would need either a second runner -
  # macos-13 is retired, and a retired label does not fail, it queues
  # forever, which held the first release hostage for an hour - or a
  # cross-compiled ffmpeg, x264 and raylib to lipo together for a universal
  # binary. Neither is worth it for a machine Apple stopped selling.
  #
  # The output is a .dmg rather than a tarball. A .app is a directory that
  # Finder draws as one icon, and that only survives a download if whatever
  # unpacked it kept it intact and the person on the other end knew not to
  # open it. A disk image mounts as a window with the application on one side
  # and Applications on the other, so the obvious gesture is the correct one.
  # ------------------------------------------------------------------
  macos:
    name: macos ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Build tools
        run: brew install nasm pkg-config ffmpeg

      - name: Cached static ffmpeg
        id: ffcache
        uses: actions/cache@v6
        with:
          path: vendor/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('tools/build-ffmpeg.sh') }}

      - name: Build static ffmpeg
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: tools/build-ffmpeg.sh --jobs 4

      - name: raylib
        run: |
          git clone --depth 1 --branch "$RAYLIB_VERSION" \
            https://github.com/raysan5/raylib.git /tmp/raylib
          tools/no-gamepads.sh /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build -DCMAKE_INSTALL_PREFIX=/tmp/rl \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/raylib/build -j3
          cmake --install /tmp/raylib/build

      - name: What the build decided
        run: RAYLIB=/tmp/rl make info

      - name: Build
        run: RAYLIB=/tmp/rl make

      - name: Tests
        run: |
          make testmedia
          make test

      # otool rather than ldd, and the same question: nothing from Homebrew,
      # which is where a linked ffmpeg would come from and where the person who
      # downloads this has nothing installed.
      - name: It carries its own ffmpeg
        run: |
          otool -L bencsnip
          if otool -L bencsnip | grep -E 'libav|libsw|libx264|homebrew|/opt/'; then
            echo "still needs something from Homebrew"
            exit 1
          fi
          echo "self-contained"

      - name: It runs
        run: ./bencsnip --version

      # dmgbuild writes the window layout into the image's .DS_Store directly.
      # The usual way to style a disk image is to mount it and drive Finder
      # over AppleScript, which needs an interactive session and therefore
      # cannot work here - it produces an unstyled image and says nothing.
      - name: dmgbuild
        run: |
          # Into a virtualenv rather than `pip3 install dmgbuild`: the runner's
          # python is externally managed, so a plain install is refused, and
          # which of pipx or --break-system-packages is available has moved
          # around between images. A venv works on all of them and needs
          # nothing installed first. tools/macos-dmg.sh takes $DMGBUILD.
          python3 -m venv /tmp/dmgvenv
          /tmp/dmgvenv/bin/pip install -q dmgbuild
          echo "DMGBUILD=/tmp/dmgvenv/bin/dmgbuild" >> "$GITHUB_ENV"

      - name: Bundle and image
        run: |
          V="${{ github.event.inputs.tag || github.ref_name }}"
          # CFBundleShortVersionString is meant to be numeric; a leading v
          # makes Finder's Get Info panel show nothing at all rather than
          # complain.
          export SN_VERSION="${V#v}"
          strip -x bencsnip
          tools/macos-app.sh bencsnip BENCsnip.app
          mkdir -p dist
          tools/macos-dmg.sh BENCsnip.app "dist/bencsnip-$V-macos-${{ matrix.arch }}.dmg"
          ls -l dist/

      # The image has to mount, and the bundle inside it has to be one
      # Gatekeeper considers intact. An ad-hoc signature identifies nobody,
      # but an invalid one gets the bundle reported as "damaged" with no way
      # to open it anyway - which is indistinguishable, to whoever downloaded
      # it, from a corrupt file.
      - name: The image mounts and the app inside it is valid
        run: |
          V="${{ github.event.inputs.tag || github.ref_name }}"
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/dmg \
            "dist/bencsnip-$V-macos-${{ matrix.arch }}.dmg"
          ls -l /tmp/dmg
          test -x "/tmp/dmg/BENCsnip.app/Contents/MacOS/BENCsnip"
          test -f "/tmp/dmg/BENCsnip.app/Contents/Resources/BENCsnip.icns"
          test -f "/tmp/dmg/BENCsnip.app/Contents/Resources/BINARY-LICENCE.txt"
          codesign --verify --deep --strict --verbose=2 "/tmp/dmg/BENCsnip.app"
          "/tmp/dmg/BENCsnip.app/Contents/MacOS/BENCsnip" --version
          hdiutil detach /tmp/dmg

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Windows, through MSYS2. The compiler runtime is linked statically by the
  # Makefile; ffmpeg is static because of the prefix built here. What is left
  # is the system's own DLLs.
  # ------------------------------------------------------------------
  windows:
    name: windows x86_64
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-ffmpeg
            git
            make
            zip
            diffutils

      - name: Cached static ffmpeg
        id: ffcache
        uses: actions/cache@v6
        with:
          path: vendor/ffmpeg
          key: ffmpeg-windows-x86_64-${{ hashFiles('tools/build-ffmpeg.sh') }}

      - name: Build static ffmpeg
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: tools/build-ffmpeg.sh --jobs 4

      - name: raylib
        run: |
          git clone --depth 1 --branch "$RAYLIB_VERSION" \
            https://github.com/raysan5/raylib.git /tmp/raylib
          tools/no-gamepads.sh /tmp/raylib
          make -C /tmp/raylib/src PLATFORM=PLATFORM_DESKTOP RAYLIB_LIBTYPE=STATIC -j2
          mkdir -p /tmp/rl/include /tmp/rl/lib
          cp /tmp/raylib/src/raylib.h /tmp/raylib/src/raymath.h /tmp/raylib/src/rlgl.h \
             /tmp/rl/include/
          cp /tmp/raylib/src/libraylib.a /tmp/rl/lib/

      - name: What the build decided
        run: RAYLIB=/tmp/rl make info

      - name: Build
        run: RAYLIB=/tmp/rl make

      - name: Tests
        run: |
          make testmedia
          make test

      # The import table is the only place the answer lives. Anything from
      # MSYS2 - the compiler runtime, ffmpeg's DLLs, raylib - means an
      # executable that starts on this runner and nowhere else.
      - name: Nothing from MSYS2 in the import table
        run: |
          objdump -p bencsnip.exe | grep 'DLL Name'
          if objdump -p bencsnip.exe | grep -iE 'DLL Name:.*(libgcc|libwinpthread|libstdc|msys-|avcodec|avformat|avutil|swscale|swresample|raylib|x264)'; then
            echo "links a DLL that will not be present on a user's machine"
            exit 1
          fi
          echo "self-contained"

      - name: Package
        run: tools/package.sh "windows-x86_64" "${{ github.event.inputs.tag || github.ref_name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-windows-x86_64
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------------------------
  # One release, five archives, one list of checksums.
  # ------------------------------------------------------------------
  publish:
    needs: [linux, macos, windows]
    # Even if one target did not make it. Five targets across three runner
    # pools means the release is hostage to the scarcest of them - macOS
    # Intel queued for twenty minutes on the first run of this - and a
    # release of four binaries today beats a release of five whenever the
    # queue clears. What is missing is named in the log and can be attached
    # later with `gh release upload`.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with: { path: dl }
      - run: ls -lR dl

      # On a tag push GITHUB_REF_NAME is the tag; on workflow_dispatch it is
      # the branch, which is how a workflow of this shape once published a
      # release called "main". The input wins whenever it is set.
      - name: Which version
        run: |
          V="${{ github.event.inputs.tag }}"
          [ -n "$V" ] || V="$GITHUB_REF_NAME"
          case "$V" in v*) ;; *) echo "refusing to release '$V' - not a v tag"; exit 1;; esac
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "releasing $V"

      # And the tag has to be the version the code thinks it is. An archive
      # named v0.2.0 holding a binary whose about box says 0.1.0 is a bug
      # report filed against the wrong version, months later.
      - name: The tag matches the source
        run: tools/check-version.sh "$VERSION"

      # The installer is compiled here rather than on the Windows runner. NSIS
      # is a cross-compiler - makensis on Linux writes a perfectly ordinary
      # Windows .exe - and building it in the job that already has every
      # platform's output in hand means one place assembles what gets
      # published.
      - name: NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis

      - name: Assemble the Windows installer
        run: |
          V="$VERSION"
          rm -rf stage && mkdir -p stage dist

          # The publish job runs even when a platform did not, so the thing
          # this is built from may not be there. Skipping is right; failing
          # here would take the other platforms' release down with it.
          if ! ls dl/pkg-windows-x86_64/*.zip >/dev/null 2>&1; then
            echo "::warning::no Windows build in this run - no installer"
            exit 0
          fi

          unzip -qo dl/pkg-windows-x86_64/*.zip -d /tmp/portable
          cp /tmp/portable/*/* stage/
          ls -l stage

          # Four numbers, and the compiler refuses anything else. The display
          # version keeps its v; this is what Windows shows in the file's
          # properties, which is where somebody with two setup .exe files in
          # Downloads finds out which is newer.
          NUM="${V#v}"
          case "$NUM" in *.*.*) ;; *) NUM="0.0.0" ;; esac
          makensis -V2 \
            -DVERSION="$V" \
            -DVIVERSION="$NUM.0" \
            -DSRCDIR="$PWD/stage" \
            -DICONFILE="$PWD/assets/icon/bencsnip.ico" \
            -DARTDIR="$PWD/assets/brand" \
            -DOUTFILE="$PWD/dist/bencsnip-$V-windows-setup.exe" \
            tools/windows-installer.nsi
          ls -l dist/

      - name: Gather
        run: |
          mkdir -p dist
          find dl -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' \) \
               -exec cp {} dist/ \;

          # Say plainly which targets are in this release and which are not,
          # rather than leaving someone to notice the gap on the download
          # page.
          missing=
          for want in linux-x86_64 linux-arm64 macos-arm64 windows-x86_64 windows-setup; do
            ls dist/ | grep -q -- "$want" || missing="$missing $want"
          done
          if [ -n "$missing" ]; then
            echo "::warning::this release is missing:$missing"
          fi
          [ -n "$(ls dist/ 2>/dev/null)" ] || { echo "nothing built at all"; exit 1; }

          cd dist
          sha256sum * > SHA256SUMS
          ls -l
          cat SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: BENCsnip ${{ env.VERSION }}
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            A video editor for the jobs that should take a minute.

            **Download the one for your machine, unpack it, run it.** Nothing to
            install: each binary carries its own ffmpeg, its own raylib, its own
            font. Linux and macOS builds are tarred rather than zipped because a
            GitHub zip does not carry the executable bit.

            | file | for |
            |---|---|
            | `*-windows-setup.exe` | Windows 10 and later — installer |
            | `*-windows-x86_64.zip` | Windows, portable: unzip and run |
            | `*-macos-arm64.dmg` | macOS, Apple silicon — drag to Applications |
            | `*-linux-x86_64.tar.gz` | Linux, Intel/AMD |
            | `*-linux-arm64.tar.gz` | Linux, ARM (Raspberry Pi 5, Ampere) |

            The installer replaces an existing BENCsnip rather than sitting
            beside it, and offers to open `.bencsnip` projects on
            double-click. It leaves video and audio files alone.

            The macOS app is signed ad-hoc, which is not a signature anyone
            can trust — it just makes the bundle valid rather than "damaged".
            The first launch still needs right-click → Open, or
            `xattr -dr com.apple.quarantine /Applications/BENCsnip.app`.

            No Intel macOS build: Apple stopped selling those, and the runner
            for them is retired.

            **Licence.** BENCsnip itself is MIT. These binaries statically link
            FFmpeg built with libx264, which is GPL, so **the binaries are under
            the GPL as a whole**. Each archive carries `BINARY-LICENCE.txt` and
            the exact FFmpeg configure line used to build it. Source: this
            repository, plus FFmpeg and x264 at the versions named in that file.

            `SHA256SUMS` covers every archive here.
