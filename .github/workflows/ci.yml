name: build

# The README claims BENCsnip builds on Linux, macOS and Windows and opens what
# ffmpeg opens. This is what turns those claims into something verified rather
# than asserted.
#
# Every job that builds something keeps it. An earlier arrangement built three
# platforms, proved they linked, and then deleted the results - so CI proved
# the binaries existed and nothing could be downloaded, which is most of the
# reason to build three platforms in the first place.
#
# The Linux job links the ffmpeg the distribution ships, because that is what
# somebody building from source has and it is the only job that proves that
# path still works.
#
# macOS and Windows link the static ffmpeg instead, from the same cache
# release.yml fills. Not for speed - it costs a minute - but because those two
# are the ones that produce something installable, and an installer built
# against Homebrew's dylibs or MSYS2's DLLs is an installer that works on the
# runner and nowhere else. What comes out of a push is now the same shape as
# what comes out of a tag, minus the version number.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

env:
  RAYLIB_VERSION: "5.5"

jobs:
  # The core links no raylib and opens no window: the property that makes a
  # headless render and these tests possible at all. Checked first and on its
  # own, because if it stops being true the three platform jobs below would
  # still pass and nothing would say so.
  core:
    name: core (no raylib, no window)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Cheap, and it guards a claim the code makes about itself: sn_version.h
      # says it is the one place a version lives.
      - name: One version, everywhere
        run: tools/check-version.sh

      - name: ffmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libavformat-dev libavcodec-dev \
                                  libswscale-dev libswresample-dev libavutil-dev

      - name: Build the core
        run: make core

      - name: The core really does not link raylib
        run: |
          if nm -uC libbencsnip.a | grep -iE 'raylib|glfw|InitWindow|BeginDrawing'; then
            echo "the core has picked up a dependency on the windowing library"
            exit 1
          fi
          echo "clean"

      # These decode, mix, cut and encode real files. A green tick here means
      # both export paths produced something ffprobe can read back, and that
      # the mixer's blocks join without a step.
      - name: Test media, then the tests
        run: |
          make testmedia
          make test

  linux:
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: X11, GL and ffmpeg headers
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libavformat-dev libavcodec-dev \
            libswscale-dev libswresample-dev libavutil-dev \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libasound2-dev xvfb

      # From source rather than from apt: the packaged version varies by runner
      # image, and a build that only compiles against one of them is not much
      # of a guarantee. Static, so the artifact runs on a machine that has
      # never heard of raylib.
      - name: raylib
        run: |
          git clone --depth 1 --branch "$RAYLIB_VERSION" \
            https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build -DCMAKE_INSTALL_PREFIX=/tmp/rl \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/raylib/build -j3
          cmake --install /tmp/raylib/build

      - name: What the build decided
        run: RAYLIB=/tmp/rl make info

      - name: Build
        run: RAYLIB=/tmp/rl make

      - name: Tests
        run: |
          make testmedia
          make test

      # assets/icon is generated and committed, so it can go stale without
      # anything saying so. The check is a script rather than inline here for
      # a reason it earned: it was inline, it was not updated when the icons
      # were renamed, and CI found that out instead of the person who renamed
      # them.
      - name: The committed icons are the right shape
        run: tools/check-icons.sh

      # A window nobody opens is a window nobody has tested. Under Xvfb this
      # creates a real GL context, loads the embedded font, decodes a file,
      # composites it and draws sixty frames of the whole interface. It is the
      # cheapest check there is that the program starts at all.
      - name: The window comes up, with something on the timeline
        run: |
          xvfb-run -a -s "-screen 0 1400x900x24" \
            ./bencsnip media/test1.mp4 --shot ci-window.png --frames 60
          test -s ci-window.png
          ls -l ci-window.png

      # Tarred rather than uploaded bare. upload-artifact zips whatever it is
      # given, and the zip format as GitHub writes it does not carry the
      # executable bit - so a downloaded binary needs a chmod before it will
      # run, which nobody expects and nothing tells them. A tar carries the
      # mode.
      - name: Package
        run: |
          D="bencsnip-$(git rev-parse --short HEAD)-linux-x86_64"
          mkdir -p "$D"
          cp bencsnip README.md ARCHITECTURE.md LICENSE NOTICE "$D"/
          tar czf "$D.tar.gz" "$D"
          echo "PKG=$D.tar.gz" >> "$GITHUB_ENV"
          ls -l "$D.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: bencsnip-linux
          path: ${{ env.PKG }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: screenshot
          path: ci-window.png
          if-no-files-found: error

  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # The command-line ffmpeg, for `make testmedia`. What gets linked is the
      # static prefix below; a vendor/ffmpeg takes precedence over pkg-config.
      - name: ffmpeg
        run: brew install ffmpeg pkg-config nasm

      # The same key release.yml writes, so a push reads the cache a tag
      # filled and neither has to build it twice.
      - name: Cached static ffmpeg
        id: ffcache
        uses: actions/cache@v6
        with:
          path: vendor/ffmpeg
          key: ffmpeg-${{ runner.os }}-arm64-${{ hashFiles('tools/build-ffmpeg.sh') }}

      - name: Build static ffmpeg
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: tools/build-ffmpeg.sh --jobs 4

      # From source and static, not `brew install raylib`. Homebrew's is a
      # dylib under /opt/homebrew, and a binary linked against it aborts at
      # launch on any machine without that exact library - which is every
      # machine that has just downloaded a build.
      - name: raylib
        run: |
          git clone --depth 1 --branch "$RAYLIB_VERSION" \
            https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build -DCMAKE_INSTALL_PREFIX=/tmp/rl \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/raylib/build -j3
          cmake --install /tmp/raylib/build

      - name: What the build decided
        run: RAYLIB=/tmp/rl make info

      - name: Build
        run: RAYLIB=/tmp/rl make

      - name: Tests
        run: |
          make testmedia
          make test

      # No window here: a macOS runner has no display, and unlike X11 there is
      # no Xvfb to stand in for one. The Linux job covers that; this one covers
      # the link, which is where macOS differs.
      - name: It runs
        run: ./bencsnip --version

      - name: It carries its own ffmpeg
        run: |
          otool -L bencsnip
          if otool -L bencsnip | grep -E 'libav|libsw|libx264|homebrew|/opt/'; then
            echo "still needs something from Homebrew"
            exit 1
          fi
          echo "self-contained"

      - name: dmgbuild
        run: |
          python3 -m venv /tmp/dmgvenv
          /tmp/dmgvenv/bin/pip install -q dmgbuild
          echo "DMGBUILD=/tmp/dmgvenv/bin/dmgbuild" >> "$GITHUB_ENV"

      # The same disk image a release ships, named after the commit instead of
      # a tag. An installer nobody can install is not worth building, so this
      # mounts it and runs what is inside.
      - name: Bundle and image
        run: |
          V="$(git rev-parse --short HEAD)"
          export SN_VERSION="0.0.0"
          strip -x bencsnip
          tools/macos-app.sh bencsnip BENCsnip.app
          mkdir -p dist
          tools/macos-dmg.sh BENCsnip.app "dist/bencsnip-$V-macos-arm64.dmg"
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/dmg "dist/bencsnip-$V-macos-arm64.dmg"
          "/tmp/dmg/BENCsnip.app/Contents/MacOS/BENCsnip" --version
          codesign --verify --deep --strict "/tmp/dmg/BENCsnip.app"
          hdiutil detach /tmp/dmg
          ls -l dist/

      - uses: actions/upload-artifact@v7
        with:
          name: bencsnip-macos-dmg
          path: dist/*
          if-no-files-found: error

  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-ffmpeg
            git
            make
            zip
            diffutils

      # The same key release.yml writes. The packaged ffmpeg above stays for
      # `make testmedia`; what gets linked is this.
      - name: Cached static ffmpeg
        id: ffcache
        uses: actions/cache@v6
        with:
          path: vendor/ffmpeg
          key: ffmpeg-windows-x86_64-${{ hashFiles('tools/build-ffmpeg.sh') }}

      - name: Build static ffmpeg
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: tools/build-ffmpeg.sh --jobs 4

      # raylib's own Makefile, not cmake. cmake's "MinGW Makefiles" generator
      # wants mingw32-make, a separate package from the MSYS make that is
      # already here, and picking the wrong generator fails at configure time
      # for reasons unrelated to this project.
      - name: raylib
        run: |
          git clone --depth 1 --branch "$RAYLIB_VERSION" \
            https://github.com/raysan5/raylib.git /tmp/raylib
          make -C /tmp/raylib/src PLATFORM=PLATFORM_DESKTOP RAYLIB_LIBTYPE=STATIC -j2
          mkdir -p /tmp/rl/include /tmp/rl/lib
          cp /tmp/raylib/src/raylib.h /tmp/raylib/src/raymath.h /tmp/raylib/src/rlgl.h \
             /tmp/rl/include/
          cp /tmp/raylib/src/libraylib.a /tmp/rl/lib/

      # raylib is built from source above, so RAYLIB= is set and pkg-config is
      # never consulted for it. Printed anyway: this is the output to read
      # first when a Windows link fails, and it should not take a code change
      # to get.
      - name: What the build decided
        run: RAYLIB=/tmp/rl make info

      - name: Build
        run: RAYLIB=/tmp/rl make

      - name: Tests
        run: |
          make testmedia
          make test

      # The import table is the only place the answer lives; grepping the
      # Makefile cannot tell you whether the flags survived. Anything from
      # MSYS2 here - the compiler runtime, ffmpeg, raylib - means an executable
      # that starts on this runner and nowhere else.
      - name: Nothing from MSYS2 in the import table
        run: |
          objdump -p bencsnip.exe | grep 'DLL Name'
          if objdump -p bencsnip.exe | grep -iE 'DLL Name:.*(libgcc|libwinpthread|libstdc|msys-|avcodec|avformat|avutil|swscale|swresample|raylib|x264)'; then
            echo "links a DLL that will not be present on a user's machine"
            exit 1
          fi
          echo "self-contained"

      # One executable and the paperwork, which is what tools/package.sh
      # assembles for a release - used here too so a push and a tag cannot
      # disagree about what goes in the box.
      - name: Package
        run: tools/package.sh windows-x86_64 "$(git rev-parse --short HEAD)"

      - uses: actions/upload-artifact@v7
        with:
          name: bencsnip-windows
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------------------------
  # The Windows installer, from the zip the job above produced.
  #
  # On Linux, because makensis is a cross-compiler - it writes a perfectly
  # ordinary Windows .exe from a Linux host - and because putting it in its own
  # job means the thing you download from a push is assembled exactly the way
  # release.yml assembles it.
  # ------------------------------------------------------------------
  installer:
    name: windows installer
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: bencsnip-windows
          path: dl

      - name: NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis

      - name: Assemble
        run: |
          V="$(git rev-parse --short HEAD)"
          rm -rf stage && mkdir -p stage dist
          unzip -qo dl/*.zip -d /tmp/portable
          cp /tmp/portable/*/* stage/
          ls -l stage

          makensis -V2 \
            -DVERSION="$V" \
            -DVIVERSION="0.0.0.0" \
            -DSRCDIR="$PWD/stage" \
            -DICONFILE="$PWD/assets/icon/bencsnip.ico" \
            -DARTDIR="$PWD/assets/brand" \
            -DOUTFILE="$PWD/dist/bencsnip-$V-windows-setup.exe" \
            tools/windows-installer.nsi

          # It has to be an installer, not merely a file that was produced.
          file dist/*.exe | tee /tmp/kind.txt
          grep -qi "nullsoft" /tmp/kind.txt
          ls -l dist/

      - uses: actions/upload-artifact@v7
        with:
          name: bencsnip-windows-setup
          path: dist/*
          if-no-files-found: error
